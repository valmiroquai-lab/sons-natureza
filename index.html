<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sons da Natureza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natureza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{ --bg:#0f1f1a; --card:#173028; --card-on:#1f5a43; --txt:#e8f3ec; --mut:#8fb2a2; --acc:#6fe3a6; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:max(env(safe-area-inset-top),16px) 16px calc(env(safe-area-inset-bottom) + 24px);
  background:radial-gradient(1200px 600px at 50% -10%,#1d4a3a 0%,var(--bg) 60%) no-repeat,var(--bg)}
h1{font-size:26px;margin:8px 0 2px;font-weight:700}
h2{font-size:15px;color:var(--mut);font-weight:600;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.bar{display:flex;gap:10px;margin-bottom:4px}
.bar button{flex:1;padding:13px 8px;border-radius:14px;border:0;background:var(--card);color:var(--txt);font-size:15px;font-weight:600}
.bar button:active{transform:scale(.97)}
.bar button.on{background:var(--card-on);color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:20px;padding:14px 14px 10px;transition:background .25s,transform .1s;border:2px solid transparent}
.card:active{transform:scale(.98)}
.card.on{background:var(--card-on);border-color:var(--acc)}
.card.wait{border-color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.emoji{font-size:32px;line-height:1}
.nome{font-size:16px;font-weight:600;line-height:1.2}
.estado{font-size:12px;color:var(--mut)}
.card.on .estado{color:var(--acc)}
input[type=range]{width:100%;margin:12px 0 2px;accent-color:var(--acc);height:28px}
.card:not(.on) input[type=range]{opacity:.35}
.rodape{margin-top:22px;color:var(--mut);font-size:12px;line-height:1.55}
.rodape a{color:var(--mut)}
details summary{cursor:pointer}
</style>
</head>
<body>
<h1>🌿 Sons da Natureza</h1>
<p class="sub">Toque para ligar. Misture quantos quiser e ajuste o volume de cada um. Continua tocando com a tela bloqueada.</p>
<div class="bar">
  <button id="btnPlay">▶ Tocar</button>
  <button id="btnTimer">⏲ Timer: desligado</button>
</div>

<h2>Natureza</h2>
<div class="grid" id="gridNat"></div>
<h2>Foco (bloqueia barulhos)</h2>
<div class="grid" id="gridFoco"></div>

<div class="rodape">
  <details><summary>Créditos das gravações</summary><div id="creditos"></div></details>
  <p>Dica: o volume geral é o botão de volume do iPhone.</p>
</div>

<script>
'use strict';
const SR = 44100;   // taxa de amostragem
const L = 60;       // duração da faixa misturada (s)
const X = 3;        // emenda suave entre o fim e o começo (s)
const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;

const SONS = [
  { id: 'chuva', nome: 'Chuva', emoji: '🌧️', g: 'nat', arq: 'sons/chuva.mp3', cred: 'Rain on leaves — Gravity Sound (CC BY 4.0)' },
  { id: 'trovoada', nome: 'Chuva e trovões', emoji: '⛈️', g: 'nat', arq: 'sons/trovoada.mp3', cred: 'Light Rain Distant Thunder — kvgarlic (CC0)' },
  { id: 'vento', nome: 'Vento na floresta', emoji: '🍃', g: 'nat', arq: 'sons/vento.mp3', cred: 'Wind in forest — Gravity Sound (CC BY 4.0)' },
  { id: 'ondas', nome: 'Ondas do mar', emoji: '🌊', g: 'nat', arq: 'sons/ondas.mp3', cred: 'Ocean waves crushing — Luftrum (CC BY 3.0)' },
  { id: 'rio', nome: 'Rio', emoji: '🏞️', g: 'nat', arq: 'sons/rio.mp3', cred: 'Río Paria en Nueva Florida — Huandy Laguna Ibarra (CC BY 4.0)' },
  { id: 'cachoeira', nome: 'Cachoeira', emoji: '💧', g: 'nat', arq: 'sons/cachoeira.mp3', cred: 'Pequeña cascada, Laguna Churup — Huandy Laguna Ibarra (CC BY 4.0)' },
  { id: 'fogo', nome: 'Fogueira', emoji: '🔥', g: 'nat', arq: 'sons/fogo.mp3', cred: 'Dry grass burning in open fireplace — ezwa (domínio público)' },
  { id: 'passaros', nome: 'Pássaros', emoji: '🐦', g: 'nat', arq: 'sons/passaros.mp3', cred: 'Birdsong morning 01 — Matutinho (CC BY-SA 4.0)' },
  { id: 'grilos', nome: 'Grilos', emoji: '🦗', g: 'nat', arq: 'sons/grilos.mp3', cred: 'Grillenzirpen nachts im Föhrenwald — DrTrumpet (CC BY-SA 4.0)' },
  { id: 'marrom', nome: 'Ruído marrom', emoji: '🟤', g: 'foco', noise: 'brown' },
  { id: 'rosa', nome: 'Ruído rosa', emoji: '🩷', g: 'foco', noise: 'pink' },
  { id: 'branco', nome: 'Ruído branco', emoji: '⚪', g: 'foco', noise: 'white' },
];

/* ---------- preparação das faixas ---------- */
const faixas = {};   // id -> {c0, c1, len}
function decodificar(ab) {
  const oc = new OAC(2, SR, SR);
  return new Promise((res, rej) => { const p = oc.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
}
function ruido(tipo, secs) {
  const n = SR * secs, chs = [];
  for (let c = 0; c < 2; c++) {
    const d = new Float32Array(n);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (tipo === 'white') d[i] = w;
      else if (tipo === 'pink') {
        b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .96900 * b2 + w * .1538520;
        b3 = .86650 * b3 + w * .3104856; b4 = .55000 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .0168980;
        d[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362; b6 = w * .115926;
      } else { last = (last + .02 * w) / 1.02; d[i] = last; }
    }
    chs.push(d);
  }
  return chs;
}
// transforma em loop sem emenda e iguala o volume entre os sons
function prepararLoop(c0, c1, xs) {
  const x = Math.floor(xs * SR), n = c0.length - x;
  const o0 = new Float32Array(n), o1 = new Float32Array(n);
  o0.set(c0.subarray(0, n)); o1.set(c1.subarray(0, n));
  for (let i = 0; i < x; i++) {
    const a = Math.sqrt(i / x), b = Math.sqrt(1 - i / x);
    o0[i] = c0[i] * a + c0[n + i] * b; o1[i] = c1[i] * a + c1[n + i] * b;
  }
  let sq = 0, pk = 0;
  for (let i = 0; i < n; i += 3) { const v = Math.abs(o0[i]); sq += v * v; if (v > pk) pk = v; }
  const rms = Math.sqrt(sq / (n / 3)) || 1;
  const g = Math.min(0.12 / rms, 0.9 / (pk || 1));
  for (let i = 0; i < n; i++) { o0[i] *= g; o1[i] *= g; }
  return { c0: o0, c1: o1, len: n };
}
async function carregar(s) {
  if (faixas[s.id]) return faixas[s.id];
  let c0, c1;
  if (s.noise) [c0, c1] = ruido(s.noise, 14);
  else {
    const ab = await (await fetch(s.arq)).arrayBuffer();
    const buf = await decodificar(ab);
    c0 = buf.getChannelData(0); c1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : c0;
  }
  return (faixas[s.id] = prepararLoop(c0, c1, 2));
}

/* ---------- mistura numa faixa única (WAV) ---------- */
function misturar(lista) {
  const total = (L + X) * SR, m0 = new Float32Array(total), m1 = new Float32Array(total);
  for (const { f, v } of lista) {
    const { c0, c1, len } = f; let j = 0;
    for (let i = 0; i < total; i++) { m0[i] += c0[j] * v; m1[i] += c1[j] * v; if (++j === len) j = 0; }
  }
  const n = L * SR, x = X * SR;
  let pk = 0;
  for (let i = 0; i < total; i++) { const a = Math.abs(m0[i]), b = Math.abs(m1[i]); if (a > pk) pk = a; if (b > pk) pk = b; }
  const g = pk > .95 ? .95 / pk : 1;
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 4, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    let a = m0[i], b = m1[i];
    if (i < x) { const p = Math.sqrt(i / x), q = Math.sqrt(1 - i / x); a = a * p + m0[n + i] * q; b = b * p + m1[n + i] * q; }
    dv.setInt16(o, Math.max(-1, Math.min(1, a * g)) * 32767, true);
    dv.setInt16(o + 2, Math.max(-1, Math.min(1, b * g)) * 32767, true); o += 4;
  }
  return new Blob([ab], { type: 'audio/wav' });
}
function silencio() {
  const ab = new ArrayBuffer(44 + 4410 * 2), dv = new DataView(ab);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + 8820, true); str(8, 'WAVE'); str(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 44100, true); dv.setUint32(28, 88200, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, 8820, true);
  return URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
}

/* ---------- player ---------- */
const audio = document.createElement('audio');
audio.loop = true; audio.preload = 'auto'; audio.setAttribute('playsinline', ''); audio.playsInline = true;
document.body.appendChild(audio);
let liberado = false, urlAtual = null, versao = 0, pausado = false, trocando = false;
const sel = {}, carregando = {};
let vols = {};
try { vols = JSON.parse(localStorage.getItem('vols2') || '{}'); } catch (e) {}
const volOf = s => vols[s.id] ?? .7;
const salvar = () => { try { localStorage.setItem('vols2', JSON.stringify(vols)); } catch (e) {} };

function liberar() {   // precisa acontecer dentro do toque do usuário (regra do iPhone)
  if (liberado) return; liberado = true;
  audio.src = silencio(); audio.play().catch(() => {});
}
async function aplicar() {
  const v = ++versao;
  const ativos = SONS.filter(s => sel[s.id]);
  if (!ativos.length) { audio.pause(); atualizar(); return; }
  ativos.forEach(s => { if (!faixas[s.id]) carregando[s.id] = true; });
  atualizar();
  let fs;
  try { fs = await Promise.all(ativos.map(carregar)); }
  catch (e) { console.error(e); alert('Não consegui carregar um dos sons. Verifique a internet e tente de novo.'); ativos.forEach(s => { delete carregando[s.id]; }); atualizar(); return; }
  ativos.forEach(s => delete carregando[s.id]);
  if (v !== versao) return;
  const blob = misturar(ativos.map((s, i) => ({ f: fs[i], v: volOf(s) })));
  const pos = urlAtual && !audio.paused ? audio.currentTime : 0;
  const url = URL.createObjectURL(blob), antigo = urlAtual; urlAtual = url;
  trocando = true;
  audio.src = url;
  audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = pos % L; } catch (e) {} }, { once: true });
  if (!pausado) await audio.play().catch(e => console.warn(e));
  trocando = false;
  if (antigo) setTimeout(() => URL.revokeObjectURL(antigo), 3000);
  atualizar();
}

/* ---------- tela de bloqueio ---------- */
function atualizar() {
  SONS.forEach(s => {
    const c = els[s.id], on = !!sel[s.id], w = !!carregando[s.id];
    c.classList.toggle('on', on && !w); c.classList.toggle('wait', w);
    c.querySelector('.estado').textContent = w ? 'carregando…' : on ? (pausado ? 'pausado' : 'tocando') : 'desligado';
  });
  const algum = SONS.some(s => sel[s.id]);
  const bp = document.getElementById('btnPlay');
  bp.textContent = pausado ? '▶ Tocar' : '⏸ Pausar'; bp.classList.toggle('on', algum && !pausado);
  if ('mediaSession' in navigator && window.MediaMetadata) {
    const nomes = SONS.filter(s => sel[s.id]).map(s => s.nome).join(' + ');
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: nomes || 'Sons da Natureza', artist: 'Sons da Natureza',
        artwork: [{ src: new URL('icon-512.png', location.href).href, sizes: '512x512', type: 'image/png' }] });
    } catch (e) {}
    navigator.mediaSession.playbackState = algum && !pausado ? 'playing' : 'paused';
  }
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { pausado = false; audio.play(); atualizar(); });
  navigator.mediaSession.setActionHandler('pause', () => { pausado = true; audio.pause(); atualizar(); });
}
audio.addEventListener('pause', () => { if (!trocando && urlAtual && SONS.some(s => sel[s.id]) && !pausado) { pausado = true; atualizar(); } });
audio.addEventListener('play', () => { if (pausado && urlAtual) { pausado = false; atualizar(); } });

/* ---------- interface ---------- */
const els = {};
SONS.forEach(s => {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<div class="top"><div class="emoji">${s.emoji}</div><div><div class="nome">${s.nome}</div><div class="estado">desligado</div></div></div>
  <input type="range" min="0.05" max="1" step="0.05" value="${volOf(s)}" aria-label="Volume ${s.nome}">`;
  c.querySelector('.top').addEventListener('click', () => {
    liberar();
    if (sel[s.id]) delete sel[s.id]; else { sel[s.id] = true; pausado = false; }
    aplicar();
  });
  const r = c.querySelector('input');
  r.addEventListener('change', () => { vols[s.id] = +r.value; salvar(); if (sel[s.id]) aplicar(); });
  document.getElementById(s.g === 'nat' ? 'gridNat' : 'gridFoco').appendChild(c);
  els[s.id] = c;
});
document.getElementById('creditos').innerHTML = SONS.filter(s => s.cred).map(s => `${s.emoji} ${s.cred}`).join('<br>') +
  '<br>Gravações do Wikimedia Commons, editadas (cortadas, em loop, volume ajustado).';
document.getElementById('btnPlay').addEventListener('click', () => {
  liberar();
  if (!SONS.some(s => sel[s.id])) return;
  if (pausado) { pausado = false; audio.play(); } else { pausado = true; audio.pause(); }
  atualizar();
});

/* ---------- timer ---------- */
const btnT = document.getElementById('btnTimer');
const OPCOES = [0, 15, 30, 60, 90, 120];
let oi = 0, prazo = 0;
function verTimer() {
  if (!oi) { btnT.textContent = '⏲ Timer: desligado'; btnT.classList.remove('on'); return; }
  const r = prazo - Date.now();
  if (r <= 0) { oi = 0; pausado = true; audio.pause(); atualizar(); verTimer(); return; }
  btnT.textContent = `⏲ ${Math.floor(r / 60000)}:${String(Math.floor(r / 1000) % 60).padStart(2, '0')}`; btnT.classList.add('on');
}
btnT.addEventListener('click', () => { oi = (oi + 1) % OPCOES.length; prazo = Date.now() + OPCOES[oi] * 60000; verTimer(); });
setInterval(verTimer, 1000);
audio.addEventListener('timeupdate', () => { if (oi) verTimer(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
